#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and repository directives

#
# GENERAL OPTIONS
#
[options]
# The following paths are commented out with their default values listed.
# If you wish to use different paths, uncomment and update the paths.
#RootDir     = /
#DBPath      = /var/lib/pacman/
#CacheDir    = /var/cache/pacman/pkg/
#LogFile     = /var/log/pacman.log
#GPGDir      = /etc/pacman.d/gnupg/
#HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc
#XferCommand = /usr/bin/curl -L -C - -f -o %o %u
#XferCommand = /usr/bin/wget --passive-ftp -c -O %o %u
#CleanMethod = KeepInstalled
Architecture = powerpc64le

# Pacman won't upgrade packages listed in IgnorePkg and members of IgnoreGroup
#IgnorePkg   =
#IgnoreGroup =

#NoUpgrade   =
#NoExtract   =

# Misc options
#UseSyslog
#Color
#NoProgressBar
# We cannot check disk space from within a chroot environment
#CheckSpace
#VerbosePkgLists
ParallelDownloads = 5

# ⛔ DownloadUser is not set here, deliberately.
#
# The stock pacman.conf sets it to alpm, which runs downloads as an
# unprivileged user. That breaks enough consumer CI that patching it back out
# is a common workaround, so this image leaves it unset. A consumer that wants
# it adds one line, rather than editing one out.

# Uncomment on a host whose kernel has no landlock, or whose runtime blocks the
# landlock syscalls. ⚠ Neither is needed on pacman 7.1.0: a sandbox that
# cannot be applied no longer stops the transaction. Measured in
# HISTORY/defect-parity.md.
#DisableSandboxFilesystem
#DisableSandboxSyscalls

# By default, pacman accepts packages signed by keys that its local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

# ⛔ There is no NoExtract rule here, deliberately.
#
# NoExtract governs what is written to disk. It does not change what the package
# database records, so every rule leaves pacman -Ql listing paths that are not
# there. A downstream consumer that walks a package's file list and checks each
# path broke on the first one it met.
#
# Every file a package ships is on disk, so the database and the filesystem
# agree. See HISTORY/noextract-reverted.md for the report and the measurements.

# NOTE: You must run `pacman-key --init` before first using pacman; the local
# keyring can then be populated with the keys of all official Arch Linux
# packagers and of the three PowerPC ports with
# `pacman-key --populate archlinux archpower`.

#
# REPOSITORIES
#   - can be defined here or included from another file
#   - pacman will search repositories in the order defined here
#   - local/custom mirrors can be added here or in separate files
#   - repositories listed first will take precedence when packages
#     have identical names, regardless of version number
#   - URLs will have $repo replaced by the name of the current repo
#   - URLs will have $arch replaced by the name of the architecture
#
# Repository entries are of the format:
#       [repo-name]
#       Server = ServerName
#       Include = IncludePath
#
# The header [repo-name] is crucial - it must be present and
# uncommented to enable the repo.
#
# ⛔ ArchPOWER does not lay its repositories out the way any other port does,
# and all three differences below are load bearing.
#
# 1. The core equivalent repository is named base. There is no core, and
#    core.db answers 404.
# 2. There is no extra at all. extra.db answers 404, and one 404 fails the
#    whole sync rather than the one repository.
# 3. Architecture specific and `any` architecture packages are in two separate
#    databases: base/<arch>/base.db and base/any/base-any.db. iana-etc is only
#    in the second, so with the first alone pacman cannot satisfy the
#    dependencies of filesystem and unwinds all the way back to base.
#
# ⚠ Two Server lines under one repository name would be two mirrors of one
# database, which is not what is needed. These are two databases, so they need
# two repository sections, and the second gets a mirrorlist of its own because
# its path is base/any and not $repo/$arch.
#
# Measured 2026-08-28. HISTORY/powerpc.md carries the counts.

[base]
Include = /etc/pacman.d/mirrorlist

[base-any]
Include = /etc/pacman.d/mirrorlist-any

# An example of a custom package repository.  See the pacman manpage for
# tips on creating your own repositories.
#[custom]
#SigLevel = Optional TrustAll
#Server = file:///home/custompkgs
