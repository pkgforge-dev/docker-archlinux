#
# /etc/pacman.conf
#
# pacman.conf(5) gives each option and each repository directive.

#
# GENERAL OPTIONS
#
[options]
# The paths below have their default values. To change a path, remove the #
# and set the value.
#RootDir     = /
#DBPath      = /var/lib/pacman/
#CacheDir    = /var/cache/pacman/pkg/
#LogFile     = /var/log/pacman.log
#GPGDir      = /etc/pacman.d/gnupg/
#HookDir     = /etc/pacman.d/hooks/
HoldPkg     = pacman glibc
#XferCommand = /usr/bin/curl -L -C - -f -o %o %u
#XferCommand = /usr/bin/wget --passive-ftp -c -O %o %u
#CleanMethod = KeepInstalled
Architecture = powerpc

# pacman does not upgrade the packages in IgnorePkg or the members of the
# groups in IgnoreGroup.
#IgnorePkg   =
#IgnoreGroup =

#NoUpgrade   =
#NoExtract   =

# Misc options
#UseSyslog
#Color
#NoProgressBar
# pacman cannot check the disk space in a chroot.
#CheckSpace
#VerbosePkgLists
ParallelDownloads = 5

# DownloadUser is not set, so pacman downloads as root. Consumer CI often
# fails when downloads run as an unprivileged user. To set it, add the line
# "DownloadUser = alpm".

# Remove the # on a host whose kernel has no landlock, or whose container
# runtime blocks the landlock system calls. pacman 7.1 continues when it cannot
# apply the sandbox, so the image needs neither.
#DisableSandboxFilesystem
#DisableSandboxSyscalls

# A package needs a valid signature from a key in the pacman keyring
# (pacman-key(8)). A database signature is optional: most ports do not sign
# their databases.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
#RemoteFileSigLevel = Required

# No NoExtract rule. Each file of a package is on the disk, so the package
# database and the file system agree. pacman -Ql lists only files that exist.

# Run "pacman-key --init" and then "pacman-key --populate" before the first
# use of pacman. The image did both when it was built.

#
# REPOSITORIES
#   - Put a repository here, or in a file that an Include line names.
#   - pacman reads the repositories in the order of this file.
#   - Put a local or custom mirror here or in a separate file.
#   - When two repositories have a package of the same name, pacman uses the
#     first repository, whatever the version.
#   - pacman replaces $repo in a URL with the name of the repository.
#   - pacman replaces $arch in a URL with the architecture.
#
# The format of a repository entry:
#       [repo-name]
#       Server = ServerName
#       Include = IncludePath
#
# The header [repo-name] is necessary. To enable the repository, remove the #
# from the header.
#

# The repositories of ArchPOWER:
#   [base]      the packages of this architecture. ArchPOWER has no core and
#               no extra.
#   [base-any]  the packages with no architecture, in a database of their own.
#               iana-etc is only there, and filesystem depends on it.
# [base-any] includes mirrorlist-any, because its path on the origin is
# base/any, not $repo/$arch.

[base]
Include = /etc/pacman.d/mirrorlist

[base-any]
Include = /etc/pacman.d/mirrorlist-any

# An example of a custom package repository. pacman(8) gives more.
#[custom]
#SigLevel = Optional TrustAll
#Server = file:///home/custompkgs
