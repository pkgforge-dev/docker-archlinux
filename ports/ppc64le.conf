# ArchPOWER, powerpc64le: 64-bit, little-endian.
#
# One port. scripts/ports reads this file. Nothing sources it.
# One key per line: `key = value`. docs/design.md gives each key.

arch = ppc64le
platform = linux/ppc64le
pacman_arch = powerpc64le
aliases = ppc64le powerpc64le
distribution = ArchPOWER
homepage = https://archlinuxpower.org
repos = base base-any
keyring = archpower
binfmt = tonistiigi
qemu = qemu-ppc64le

# The cross build of the static pacman (scripts/build-pacman-static).
zig_triple = powerpc64le-linux-musl
host_triplet = powerpc64le-unknown-linux-musl
openssl_target = linux-ppc64le
elf_machine = PowerPC64
meson_cpu_family = ppc64
endian = little
