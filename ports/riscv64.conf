# Arch Linux RISC-V, riscv64.
#
# One port. scripts/ports reads this file. Nothing sources it.
# One key per line: `key = value`. docs/design.md gives each key.

arch = riscv64
platform = linux/riscv64
pacman_arch = riscv64
aliases = riscv64
distribution = Arch Linux RISC-V
homepage = https://archriscv.felixc.at
repos = core extra
keyring = none
binfmt = tonistiigi
qemu = qemu-riscv64

# The cross build of the static pacman (scripts/build-pacman-static).
zig_triple = riscv64-linux-musl
host_triplet = riscv64-unknown-linux-musl
openssl_target = linux64-riscv64
elf_machine = RISC-V
meson_cpu_family = riscv64
endian = little
