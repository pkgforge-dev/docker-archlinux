# Arch Linux, x86_64.
#
# One port. scripts/ports reads this file. Nothing sources it.
# One key per line: `key = value`. docs/design.md gives each key.

arch = amd64
platform = linux/amd64
pacman_arch = x86_64
aliases = x86_64 amd64
distribution = Arch Linux
homepage = https://archlinux.org
repos = core extra
keyring = none
binfmt = native
qemu = qemu-x86_64

# The cross build of the static pacman (scripts/build-pacman-static).
zig_triple = x86_64-linux-musl
host_triplet = x86_64-unknown-linux-musl
openssl_target = linux-x86_64
elf_machine = Advanced Micro Devices X86-64
meson_cpu_family = x86_64
endian = little
