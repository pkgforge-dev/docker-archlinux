# ArchPOWER, powerpc64: 64-bit, big-endian.
#
# One port. scripts/ports reads this file. Nothing sources it.
# One key per line: `key = value`. docs/design.md gives each key.

arch = ppc64
platform = linux/ppc64
pacman_arch = powerpc64
aliases = ppc64 powerpc64
distribution = ArchPOWER
homepage = https://archlinuxpower.org
repos = base base-any
keyring = archpower
binfmt = multiarch
qemu = qemu-ppc64

# The cross build of the static pacman (scripts/build-pacman-static).
zig_triple = powerpc64-linux-musl
host_triplet = powerpc64-unknown-linux-musl
openssl_target = linux-ppc64
elf_machine = PowerPC64
meson_cpu_family = ppc64
endian = big
