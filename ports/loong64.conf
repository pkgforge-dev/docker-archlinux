# Arch Linux for Loong64 (LCPU), loong64.
#
# One port. scripts/ports reads this file. Nothing sources it.
# One key per line: `key = value`. docs/design.md gives each key.

arch = loong64
platform = linux/loong64
pacman_arch = loong64
aliases = loongarch64 loong64
distribution = Arch Linux for Loong64 (LCPU)
homepage = https://loongarchlinux.lcpu.dev
repos = core extra
keyring = archlinux-lcpu
binfmt = tonistiigi
qemu = qemu-loongarch64

# The cross build of the static pacman (scripts/build-pacman-static).
zig_triple = loongarch64-linux-musl
host_triplet = loongarch64-unknown-linux-musl
openssl_target = linux64-loongarch64
elf_machine = LoongArch
meson_cpu_family = loongarch64
endian = little
