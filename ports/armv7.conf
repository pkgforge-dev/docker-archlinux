# Arch Linux ARM, armv7h.
#
# One port. scripts/ports reads this file. Nothing sources it.
# One key per line: `key = value`. docs/design.md gives each key.

arch = armv7
platform = linux/arm/v7
pacman_arch = armv7h
aliases = armv7l armv7h armv7
distribution = Arch Linux ARM
homepage = https://archlinuxarm.org
repos = core extra alarm aur
keyring = archlinuxarm
binfmt = tonistiigi
qemu = qemu-arm

# The cross build of the static pacman (scripts/build-pacman-static).
zig_triple = arm-linux-musleabihf
host_triplet = arm-unknown-linux-musleabihf
openssl_target = linux-armv4
elf_machine = ARM
meson_cpu_family = arm
endian = little
