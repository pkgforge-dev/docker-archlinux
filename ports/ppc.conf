# ArchPOWER, powerpc: 32-bit, big-endian.
#
# One port. scripts/ports reads this file. Nothing sources it.
# One key per line: `key = value`. docs/design.md gives each key.

arch = ppc
platform = linux/ppc
pacman_arch = powerpc
aliases = ppc powerpc
distribution = ArchPOWER
homepage = https://archlinuxpower.org
repos = base base-any
keyring = archpower
binfmt = multiarch
qemu = qemu-ppc

# The cross build of the static pacman (scripts/build-pacman-static).
zig_triple = powerpc-linux-musleabi
host_triplet = powerpc-unknown-linux-musleabi
openssl_target = linux-ppc
elf_machine = PowerPC
meson_cpu_family = ppc
endian = big
