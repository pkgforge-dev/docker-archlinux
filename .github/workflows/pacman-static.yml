name: Static pacman

# Build a static pacman for every port, from bootstrap/pacman-static/sources.pin.
#
# Triggers:
#   schedule           each Sunday, so a break shows before the monthly release
#   workflow_dispatch  build and upload the artifacts
#   workflow_call      release.yml calls this workflow for its assets
#
# Nothing here publishes a release. ⛔ The Dockerfile does not read the pin and
# does not fetch these binaries. tests/static/85-pacman-static-pin.sh checks it.
#
# ⚠ No concurrency group. A run writes only its own artifacts. A group would
# let a dispatch cancel or replace the pacman jobs of a release run.
on:
  schedule:
    - cron: "20 3 * * 0"
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  #--------------------------------------------------------------------------#
  # The port matrix, and the downloads. Each tarball is downloaded and checked
  # once here, then the build jobs restore it from the cache. A build job that
  # gets no cache downloads for itself.
  #--------------------------------------------------------------------------#
  setup:
    name: Ports and downloads
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.ports.outputs.matrix }}
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the port table
        id: ports
        run: |
          set -euo pipefail
          matrix="$(scripts/ports matrix)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "ports: $(scripts/ports list | tr '\n' ' ')"

      # The key is the sha256 of the pinned sha256 values. A change of a
      # comment in the pin keeps the key. A file in the cache has its sha256 as
      # its name, so an older cache from the restore-keys prefix is safe.
      - name: Make the download cache key
        id: key
        run: |
          set -euo pipefail
          sum="$(awk '$1 == "zig" || $1 == "source" { print $5 }' bootstrap/pacman-static/sources.pin \
            | LC_ALL=C sort | sha256sum | awk '{ print $1 }')"
          echo "key=pacman-static-dl-$sum" >> "$GITHUB_OUTPUT"

      - name: Restore the download cache
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pacman-static/dl
          key: ${{ steps.key.outputs.key }}
          restore-keys: pacman-static-dl-

      # Each URL of a record is tried in pin order. The sha256 decides.
      - name: Download and check every pinned tarball
        if: steps.restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/pacman-static" scripts/build-pacman-static --fetch

      - name: Save the download cache
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pacman-static/dl
          key: ${{ steps.key.outputs.key }}

  #--------------------------------------------------------------------------#
  # One job per port. fail-fast is off, so one run shows every broken port.
  # zig cross compiles each port on this x86_64 runner. qemu-user only runs
  # the finished binary.
  #--------------------------------------------------------------------------#
  build:
    name: Static pacman ${{ matrix.arch }}
    needs: setup
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the download cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pacman-static/dl
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: pacman-static-dl-

      # ⛔ meson comes from scripts/install-tools, at its pinned version and
      # sha256, never from apt. The apt meson of the runner is older than the
      # minimum of the build script. scripts/install-tools is the one place
      # that names the version.
      - name: Install the build tools and the emulators
        run: |
          set -euo pipefail
          timeout -k 5 600 sudo apt-get -o Acquire::Retries=3 update -qq
          timeout -k 5 900 sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends \
            ninja-build gperf pkg-config gnupg qemu-user-static
          scripts/install-tools "$RUNNER_TEMP/tools" meson
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          echo "meson $("$RUNNER_TEMP/tools/meson" --version), ninja $(ninja --version)"

      # ⛔ The build writes NOT MEASURED when the emulator is missing, and
      # --check-evidence refuses that later. This step names the cause first.
      - name: Check the emulator of this port
        env:
          QEMU: ${{ matrix.qemu }}
        run: |
          set -euo pipefail
          emu="${QEMU}-static"
          if ! command -v "$emu" > /dev/null; then
            echo "::error::$emu is not on PATH. The package qemu-user-static installs it."
            echo "present:"
            find /usr/bin -maxdepth 1 -name 'qemu-*-static' -printf '  %f\n'
            exit 1
          fi
          echo "$emu: $("$emu" --version | awk 'NR == 1')"

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/pacman-static" OUT="$RUNNER_TEMP/dist" \
            scripts/build-pacman-static "$ARCH"

      # ⛔ An asset needs a verified signed tag, a binary that ran under its
      # emulator, and no dynamic loader.
      - name: Check the evidence
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ev="$RUNNER_TEMP/dist/pacman-static-$ARCH.json"
          scripts/build-pacman-static --check-evidence "$ev"
          {
            echo "### pacman-static-$ARCH"
            echo
            jq -r '"| key | value |", "| --- | --- |",
                   (to_entries[] | select(.key != "sources") | "| \(.key) | \(.value) |")' "$ev"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pacman-static-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/dist/pacman-static-${{ matrix.arch }}
            ${{ runner.temp }}/dist/pacman-static-${{ matrix.arch }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
