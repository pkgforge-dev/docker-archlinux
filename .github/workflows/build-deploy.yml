name: 🐬 Builds ArchLinux Images for DockerHub 🐬
#REF: https://docs.docker.com/build/ci/github-actions/multi-platform/
#SECRETS: DOCKERHUB_USERNAME || DOCKERHUB_TOKEN
#URL: https://hub.docker.com/r/pkgforge/archlinux/tags
#For: https://github.com/pkgforge/devscripts/tree/main/Github/Runners
#------------------------------------------------------------------------------------#
# One job per architecture builds and pushes by digest. No tag is created there.
# The publish job creates every tag from those digests.
#
# ⛔ One architecture failing does not hold the others back. Every architecture
# that built is tagged. One that did not keeps its last published image in the
# multi architecture index, so `latest` never loses a platform and never stops
# moving because one port had a bad day. The run is still red when a build
# failed, and the report job keeps one issue open per architecture until it
# publishes again. Before this, one port failing published nothing for any
# port: no tag moved from 2026-09-06 to 2026-10-13. HISTORY/outage-2026-09.md.
#
# Run it with dry_run to build against a scratch repository and create no public
# tag. That is how a branch is tested without a consumer seeing anything.
#------------------------------------------------------------------------------------#
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Push to a scratch repository and create no public tag
        type: boolean
        default: false
      dry_run_hub:
        description: With dry_run, also copy to the Docker Hub scratch repository
        type: boolean
        default: false
      # ⛔ The rollback guard's only way through. A stale but validly signed
      # package set is what an on-path attacker on a plain http ARM mirror can
      # serve, and signatures do not catch it. A legitimate upstream revert
      # exists too, so the override is a named, deliberate act rather than a
      # silent pass. HISTORY/arm-rollback.md.
      allow_anchor_downgrade:
        description: Publish even though an anchor version went backwards
        type: boolean
        default: false
  schedule:
    - cron: "30 05 * * *"  # daily, 05:30 UTC
    # ⭐ The second chance. GitHub drops scheduled runs under load, and a run
    # that dies before it publishes loses the day. This one stands down when the
    # day's dated index tag already exists, so it never moves a dated tag.
    - cron: "30 17 * * *"  # daily, 17:30 UTC, only when 05:30 published nothing

defaults:
  run:
    shell: bash

permissions:
  contents: read

# A superseded scheduled run is cancelled rather than racing the newer one.
concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/archlinux
  HUB_IMAGE: pkgforge/archlinux
  SCRATCH_IMAGE: ghcr.io/${{ github.repository_owner }}/archlinux-ci
  # The Docker Hub side of a dry run. Copying across registries is the one part
  # of the publish that a GHCR-only dry run cannot reach, so it needs a scratch
  # repository of its own on the other registry.
  HUB_SCRATCH_IMAGE: pkgforge/archlinux-ci
  # ⛔ The cron above that is the second chance. Written once, here, and compared
  # against the cron that fired, so the two cannot drift apart.
  BACKUP_CRON: "30 17 * * *"

#------------------------------------------------------------------------------------#
jobs:
  #----------------------------------------------------------------------------------#
  # Resolve every input once. Each architecture then builds against the same
  # version, the same commit and an anchor pinned before any build started, so a
  # run is reproducible as a unit and not only job by job.
  #
  # ⛔ A port that cannot be read from this runner is held back on its own. It is
  # named, it is not built, and the rest go ahead. Before this, one unreachable
  # port stopped the whole run in this job: ArchPOWER answered 403 from
  # 2026-09-18 and no architecture built at all.
  #----------------------------------------------------------------------------------#
  resolve:
    name: Resolve inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      build_date: ${{ steps.inputs.outputs.build_date }}
      anchors: ${{ steps.inputs.outputs.anchors }}
      skip_servers: ${{ steps.inputs.outputs.skip_servers }}
      unreachable: ${{ steps.inputs.outputs.unreachable }}
      refused: ${{ steps.floor.outputs.refused }}
      cleared: ${{ steps.clear.outputs.cleared }}
      skip: ${{ steps.inputs.outputs.skip }}
      target_image: ${{ steps.inputs.outputs.target_image }}
      hub_image: ${{ steps.inputs.outputs.hub_image }}
      publish_hub: ${{ steps.inputs.outputs.publish_hub }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve
        id: inputs
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DRY_RUN_HUB: ${{ inputs.dry_run_hub }}
          FIRED_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          version="$(date -u +'%Y.%m.%d')"
          build_date="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # ⛔ dry_run_hub only makes sense inside a dry run. Without this guard
          # a run with dry_run_hub alone would take the real branch and read as
          # though it had tested something.
          if [ "${DRY_RUN_HUB:-false}" = "true" ] && [ "${DRY_RUN:-false}" != "true" ]; then
            echo "dry_run_hub needs dry_run. On its own it would publish to the real repositories." >&2
            exit 1
          fi

          if [ "${DRY_RUN:-false}" = "true" ]; then
            target_image="$SCRATCH_IMAGE"
            hub_image="$HUB_SCRATCH_IMAGE"
            if [ "${DRY_RUN_HUB:-false}" = "true" ]; then
              publish_hub=true
              echo "::notice::dry run into ${SCRATCH_IMAGE} and ${HUB_SCRATCH_IMAGE}, exercising the cross-registry copy, creating no public tag"
            else
              publish_hub=false
              echo "::notice::dry run, building into ${SCRATCH_IMAGE} and creating no public tag"
            fi
          else
            target_image="$GHCR_IMAGE"
            hub_image="$HUB_IMAGE"
            publish_hub=true
          fi

          {
            echo "version=$version"
            echo "build_date=$build_date"
            echo "target_image=$target_image"
            echo "hub_image=$hub_image"
            echo "publish_hub=$publish_hub"
          } >> "$GITHUB_OUTPUT"

          # ⭐ The second chance stands down when the day already published. The
          # dated index tag is the record of that, read anonymously from the
          # registry like every other published fact here.
          skip=false
          if [ "${FIRED_CRON:-}" = "$BACKUP_CRON" ]; then
            repo="${target_image#ghcr.io/}"
            token="$(curl -sS --connect-timeout 15 --max-time 60 --retry 2 --retry-delay 5 \
              "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" | jq -r '.token // empty')"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 60 \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/v${version}")"
            if [ "$code" = "200" ]; then
              skip=true
              echo "::notice::v${version} is already published, so the second chance has nothing to do"
            else
              echo "::warning::v${version} is not published (HTTP ${code}), so the second chance builds"
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [ "$skip" = "true" ]; then
            {
              echo "anchors={}"
              echo "skip_servers={}"
              echo "unreachable="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The anchor names the pinned tag family. The ports are not in
          # lockstep, so it is resolved per architecture.
          #
          # ⛔ A port no mirror answers for is named and held back, and the loop
          # goes on. resolve-anchor has already tried every server in that
          # port's list and printed each refusal.
          #
          # ⛔ The first server of a list is checked first. On five ports it is
          # the GHCR mirror, which follows upstream on its own schedule. When
          # it is behind, the port builds without it, and the anchor comes
          # from the same shorter list. The image still ships the full list.
          anchors='{'
          skips='{}'
          sep=''
          unreachable=''
          for arch in amd64 arm64 armv7 loong64 riscv64 ppc ppc64 ppc64le; do
            skip_server=''
            rc=0
            verdict="$(scripts/check-mirror-lag "$arch" 2> "/tmp/lag-$arch.err")" || rc=$?
            sed 's/^/  /' "/tmp/lag-$arch.err"
            case "$rc:$verdict" in
              0:keep) ;;
              "0:drop "*)
                skip_server="${verdict#drop }"
                skips="$(jq -c --arg a "$arch" --arg s "$skip_server" '. + { ($a): $s }' <<< "$skips")"
                echo "::warning::$arch builds without $skip_server: it is behind upstream, measured above. The image still ships it."
                ;;
              *)
                echo "::warning::the mirror lag check for $arch did not decide (exit $rc), so the build reads the list as it is"
                ;;
            esac
            rc=0
            anchor="$(SKIP_SERVER="$skip_server" scripts/resolve-anchor "$arch" 2> "/tmp/resolve-$arch.err")" || rc=$?
            if [ "$rc" -eq 0 ] && [ -n "$anchor" ]; then
              anchors="${anchors}${sep}\"${arch}\":\"${anchor}\""
              sep=','
              echo "anchor for $arch: $anchor"
            else
              unreachable="$unreachable $arch"
              echo "::warning::$arch is held back: no mirror in rootfs/$arch/etc/pacman.d/mirrorlist served its database to this runner"
              sed 's/^/  /' "/tmp/resolve-$arch.err"
            fi
          done
          anchors="${anchors}}"
          jq -e . <<< "$anchors" > /dev/null
          {
            echo "anchors=$anchors"
            echo "skip_servers=$skips"
            echo "unreachable=${unreachable# }"
          } >> "$GITHUB_OUTPUT"

      # ⛔ A build whose anchor went backwards is refused here, before anything
      # is built or pushed. 20 of the 46 shipped mirrors are plain http, all on
      # the two ARM ports, because the mirror Arch Linux ARM recommends offers
      # no https. An on-path attacker there cannot forge a package, and can
      # serve a stale but validly signed set. Signatures do not catch that.
      #
      # The floor is what this repository already published, read from the
      # public tag list with no token and no state file. FLOOR_IMAGE is the
      # real repository even in a dry run: the floor is a fact about the
      # packages, not about where this run intends to push.
      #
      # ⛔ Refused per architecture. The port that went backwards is held and
      # its build job goes red; the rest are not held hostage by it. A floor
      # that cannot be read at all refuses every port, because a guard that a
      # transient switches off is not a guard.
      - name: Refuse a build whose anchor went backwards
        id: floor
        if: steps.inputs.outputs.skip != 'true'
        env:
          ANCHORS: ${{ steps.inputs.outputs.anchors }}
          FLOOR_IMAGE: ${{ env.GHCR_IMAGE }}
          ALLOW_ANCHOR_DOWNGRADE: ${{ inputs.allow_anchor_downgrade && '1' || '0' }}
          CONTAINER_RUNTIME: docker
        run: |
          set -euo pipefail
          if [ "$ANCHORS" = "{}" ]; then
            echo "no port served its database to this runner, so there is nothing to check and nothing to build" >&2
            exit 1
          fi
          rc=0
          scripts/check-anchor-floor "$ANCHORS" > /tmp/floor.txt || rc=$?
          cat /tmp/floor.txt
          case "$rc" in
            0) refused="" ;;
            3)
              refused="$(awk '$1 == "BEHIND" { printf "%s ", $2 }' /tmp/floor.txt)"
              echo "::error::the anchor went backwards on: ${refused% }. Those are not built. Re-run with allow_anchor_downgrade if upstream really reverted."
              ;;
            *)
              echo "the anchor floor could not be read, so no port is cleared to publish" >&2
              exit 1
              ;;
          esac
          echo "refused=${refused% }" >> "$GITHUB_OUTPUT"

      - name: Decide what builds
        id: clear
        if: steps.inputs.outputs.skip != 'true'
        env:
          ANCHORS: ${{ steps.inputs.outputs.anchors }}
          REFUSED: ${{ steps.floor.outputs.refused }}
        run: |
          set -euo pipefail
          cleared="$(jq -c --arg refused "$REFUSED" '
            ($refused | split(" ") | map(select(length > 0))) as $r
            | with_entries(select(.key as $k | ($r | index($k)) == null))' <<< "$ANCHORS")"
          echo "cleared=$cleared" >> "$GITHUB_OUTPUT"
          n="$(jq -r 'length' <<< "$cleared")"
          if [ "$n" -eq 0 ]; then
            echo "no port is cleared to build: each is unreachable or refused, named above" >&2
            exit 1
          fi
          echo "::notice::$n port(s) cleared to build: $(jq -r 'keys | join(" ")' <<< "$cleared")"

      - name: Check the repository before building it
        if: steps.inputs.outputs.skip != 'true'
        run: tests/run.sh static

  #----------------------------------------------------------------------------------#
  # Build each architecture and push it by digest. No tag is created here.
  #
  # The Dockerfile runs pacman on the builder's own architecture and only the
  # last few steps are emulated, so QEMU is set up but carries little of the
  # work. Cache is keyed per architecture: one shared key thrashes.
  #
  # There is no runner debloat step. Each job now builds one architecture rather
  # than all of them in one job, so the disk pressure that step existed for is
  # much lower. ⚠ Runner disk use has not been measured on this workflow.
  #----------------------------------------------------------------------------------#
  build:
    name: Build ${{ matrix.docker_arch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      # One run reports every broken architecture, and none stops another.
      fail-fast: false
      matrix:
        include:
          - docker_arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          # Set the ARM64_RUNNER repository variable to a native arm64 label to
          # take this target out of emulation. ⚠ Whether this repository has
          # access to those runners is unverified, so the default keeps QEMU.
          - docker_arch: arm64
            platform: linux/arm64
            runner: ${{ vars.ARM64_RUNNER || 'ubuntu-latest' }}
          - docker_arch: armv7
            platform: linux/arm/v7
            runner: ubuntu-latest
          # The loong64 port is published by the Linux Club of Peking
          # University, not by Arch, so it carries its own keyring. Both
          # feasibility gates are measured in HISTORY/loong64.md.
          - docker_arch: loong64
            platform: linux/loong64
            runner: ubuntu-latest
          - docker_arch: riscv64
            platform: linux/riscv64
            runner: ubuntu-latest
          # The three PowerPC ports are published by ArchPOWER, which carries
          # its own keyring and lays its repositories out differently from
          # every other port: the core equivalent is named base, there is no
          # extra, and `any` architecture packages are in a second database.
          # HISTORY/powerpc.md has the measurements.
          - docker_arch: ppc
            platform: linux/ppc
            runner: ubuntu-latest
          - docker_arch: ppc64
            platform: linux/ppc64
            runner: ubuntu-latest
          - docker_arch: ppc64le
            platform: linux/ppc64le
            runner: ubuntu-latest
    steps:
      # ⛔ The first step decides, and every step after it asks. A port the
      # resolve job held back is not built: unreachable is a warning and a green
      # job, because the cause is a network this repository does not own and the
      # report job keeps an issue open for it; refused by the anchor floor is a
      # red job, because that one needs a decision.
      - name: Check this architecture is cleared to build
        id: gate
        env:
          DOCKER_ARCH: ${{ matrix.docker_arch }}
          CLEARED: ${{ needs.resolve.outputs.cleared }}
          REFUSED: ${{ needs.resolve.outputs.refused }}
          SKIP: ${{ needs.resolve.outputs.skip }}
        run: |
          set -euo pipefail
          if [ "$SKIP" = "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::today is already published, nothing to build"
            exit 0
          fi
          cleared="${CLEARED:-}"
          [ -n "$cleared" ] || cleared='{}'
          if jq -e --arg a "$DOCKER_ARCH" 'has($a)' <<< "$cleared" > /dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "$DOCKER_ARCH is cleared, anchor $(jq -r --arg a "$DOCKER_ARCH" '.[$a]' <<< "$cleared")"
            exit 0
          fi
          echo "build=false" >> "$GITHUB_OUTPUT"
          if tr ' ' '\n' <<< "$REFUSED" | awk -v a="$DOCKER_ARCH" '$0 == a { found = 1 } END { exit found ? 0 : 1 }'; then
            echo "::error::$DOCKER_ARCH is refused: its anchor went backwards. Its last published image stays in the index."
            exit 1
          fi
          echo "::warning::$DOCKER_ARCH is not built today: no mirror served its database to this runner. Its last published image stays in the index."

      - name: Checkout
        if: steps.gate.outputs.build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: steps.gate.outputs.build == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      # ⛔ The action does not cover big endian PowerPC, and nothing says so.
      # tonistiigi/binfmt, which it runs, ships nine emulators: aarch64, arm,
      # i386, loongarch64, mips64, mips64el, ppc64le, riscv64 and s390x.
      # qemu-ppc and qemu-ppc64 are not among them. Measured 2026-08-28 by
      # listing the image's own filesystem.
      #
      # The last stage of the Dockerfile runs pacman-key and locale-gen as
      # target architecture binaries, so without a handler those two jobs fail
      # at "exec format error" partway through a build that already downloaded
      # every package.
      #
      # Ubuntu's own qemu-user-static ships both. update-binfmts imports the
      # handler the package describes rather than a magic string written here.
      - name: Register the big endian PowerPC emulators
        if: steps.gate.outputs.build == 'true' && (matrix.docker_arch == 'ppc' || matrix.docker_arch == 'ppc64')
        env:
          DOCKER_ARCH: ${{ matrix.docker_arch }}
        run: |
          set -euo pipefail
          handler="qemu-${DOCKER_ARCH}"

          # ⛔ Not apt. Ubuntu's qemu-user-static ships the emulators and no
          # binfmt descriptions at all: /usr/share/binfmts holds one entry,
          # python3.13, and update-binfmts --import qemu-ppc answers "couldn't
          # find information about 'qemu-ppc' to import" and exits 2. Measured
          # 2026-08-28 on this workflow and in a Debian trixie container.
          #
          # This image registers every emulator it ships, with the F flag, which
          # is the thing that has to be true. Pinned by digest like every other
          # image here, and scripts/check-image-pins reads the marker.
          # tag: latest
          docker run --rm --privileged \
            docker.io/multiarch/qemu-user-static@sha256:fe60359c92e86a43cc87b3d906006245f77bfc0565676b80004cc666e4feb9f0 \
            --reset -p yes

          # ⛔ Asserted, not assumed. A registration that did nothing leaves the
          # build to fail much later, inside a buildx step, with a message about
          # exec format that names no architecture.
          reg="/proc/sys/fs/binfmt_misc/${handler}"
          if [ ! -f "$reg" ]; then
            echo "${handler} is not registered after the binfmt image ran" >&2
            echo "registered handlers:" >&2
            ls /proc/sys/fs/binfmt_misc >&2
            exit 1
          fi
          cat "$reg"

          # ⚠ The F flag is what makes the handler usable from inside a
          # container. Without it the kernel opens the interpreter in the
          # container's own filesystem, where the emulator does not exist, and
          # buildkit's target stage cannot run a single target binary.
          if ! awk '/^flags:/ && $2 ~ /F/ { found = 1 } END { exit !found }' "$reg"; then
            echo "${handler} is registered without the F flag" >&2
            echo "the emulator would have to exist inside the build container, and it does not" >&2
            exit 1
          fi
          echo "::notice::${handler} registered with the F flag"

      - name: Set up Docker Buildx
        if: steps.gate.outputs.build == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.workspace }}
          platforms: ${{ matrix.platform }}
          # SKIP_SERVER is empty unless the resolve job found this port's
          # first server behind upstream. The step below passes the same
          # value, so the bootstrap stage it exports is the one built here.
          build-args: |
            IMAGE_VERSION=${{ needs.resolve.outputs.version }}
            SOURCE_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ needs.resolve.outputs.build_date }}
            SKIP_SERVER=${{ fromJSON(needs.resolve.outputs.skip_servers || '{}')[matrix.docker_arch] }}
          outputs: type=image,name=${{ needs.resolve.outputs.target_image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.docker_arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.docker_arch }}
          provenance: mode=max
          sbom: true

      # ⛔ The databases the build resolved against, taken from the build rather
      # than fetched again. A package superseded upstream between the two is
      # installed in the image and absent from every current database, so the
      # evidence has a hole and the build fails. Scheduled run 33094128354 lost
      # amd64 to exactly that: its build step began at 16:37:48Z and the second
      # read of core.db landed at 16:38:51Z, 63 seconds of window, and
      # ca-certificates-mozilla moved from 3.127-1 to 3.128-1 inside it.
      #
      # The bootstrap stage is already in the builder from the step above, so
      # this exports files rather than installing anything again. A cache miss
      # would resolve against newer databases, and gen-evidence still names any
      # package it cannot account for, so the check is unchanged either way.
      # HISTORY/evidence-race.md.
      - name: Export the databases the build resolved against
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.workspace }}
          platforms: ${{ matrix.platform }}
          target: dbsnapshot
          build-args: |
            IMAGE_VERSION=${{ needs.resolve.outputs.version }}
            SKIP_SERVER=${{ fromJSON(needs.resolve.outputs.skip_servers || '{}')[matrix.docker_arch] }}
          outputs: type=local,dest=/tmp/dbsnapshot
          cache-from: type=gha,scope=${{ matrix.docker_arch }}

      - name: Record the evidence for what was pushed
        if: steps.gate.outputs.build == 'true'
        env:
          IMAGE: ${{ needs.resolve.outputs.target_image }}@${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          DOCKER_ARCH: ${{ matrix.docker_arch }}
          CONTAINER_RUNTIME: docker
          SOURCE_COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ needs.resolve.outputs.build_date }}
          # Read where the build left them. gen-evidence refuses to start when
          # this directory is missing a database for an enabled repository, so
          # an export that silently produced nothing cannot pass as a fetch.
          DB_SNAPSHOT: /tmp/dbsnapshot
        run: |
          set -euo pipefail
          # --platform is required. provenance and sbom wrap the pushed
          # manifest in an index, so a bare pull selects the runner's own
          # architecture and fails with "no matching manifest for linux/amd64".
          docker pull --platform "$PLATFORM" "$IMAGE"
          mkdir -p /tmp/evidence
          # Which package, which version, which size, which checksum, and when
          # it was built. A record saying the build succeeded is not evidence.
          scripts/gen-evidence "$DOCKER_ARCH" "$IMAGE" "$PLATFORM" \
            "/tmp/evidence/evidence-${DOCKER_ARCH}.json"

      - name: Test what was actually pushed
        if: steps.gate.outputs.build == 'true'
        env:
          IMAGE: ${{ needs.resolve.outputs.target_image }}@${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          CONTAINER_RUNTIME: docker
          EVIDENCE: /tmp/evidence/evidence-${{ matrix.docker_arch }}.json
        run: |
          set -euo pipefail
          # The image suite inspects without starting, so an architecture whose
          # bootstrap installed nothing still fails with a readable assertion
          # rather than a runc error.
          tests/run.sh image

      - name: Upload the evidence
        if: steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ matrix.docker_arch }}
          path: /tmp/evidence/evidence-${{ matrix.docker_arch }}.json
          if-no-files-found: error
          retention-days: 90

      # ⛔ Last, after every test. A digest is what the publish job tags, so an
      # image that failed anything above leaves none behind and is never tagged.
      - name: Export the digest
        if: steps.gate.outputs.build == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "$DIGEST" ]; then
            echo "the build produced no digest" >&2
            exit 1
          fi
          mkdir -p /tmp/digests
          printf '%s' "$DIGEST" > "/tmp/digests/${{ matrix.docker_arch }}"

      - name: Upload the digest
        if: steps.gate.outputs.build == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.docker_arch }}
          path: /tmp/digests/${{ matrix.docker_arch }}
          if-no-files-found: error
          retention-days: 1

  #----------------------------------------------------------------------------------#
  # Create every tag from the digests the matrix produced.
  #
  # ⛔ It runs when any architecture built, not only when all of them did. Each
  # architecture that built gets its own tags. One that did not keeps the image
  # its tags already point at, and that same image goes into the index, so the
  # index always carries every platform ever published. An architecture never
  # published at all is left out of the index and named.
  #
  # ⛔ A run in which nothing built moves no tag at all, because a dated index
  # made only of carried images would date a build that never happened.
  #
  # The per architecture tags are created first and the index tags last, so
  # :latest only moves after everything else has succeeded.
  #----------------------------------------------------------------------------------#
  publish:
    name: Create tags
    needs: [resolve, build]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      fresh: ${{ steps.plan.outputs.fresh }}
      carried: ${{ steps.plan.outputs.carried }}
      absent: ${{ steps.plan.outputs.absent }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      # ⛔ Every architecture gets a line: a digest built in this run, or the
      # digest its own rolling tag already points at, or nothing. The carried
      # digest is read from the real repository even in a dry run, because what
      # was published is a fact about the real one; nothing is written there.
      - name: Decide what each architecture publishes
        id: plan
        env:
          TARGET_IMAGE: ${{ needs.resolve.outputs.target_image }}
          CARRY_IMAGE: ${{ env.GHCR_IMAGE }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          repo="${CARRY_IMAGE#ghcr.io/}"
          token="$(curl -sS --connect-timeout 15 --max-time 60 --retry 2 --retry-delay 5 \
            "https://ghcr.io/token?scope=repository:${repo}:pull&service=ghcr.io" | jq -r '.token // empty')"
          [ -n "$token" ] || { echo "no anonymous pull token for ${repo}, so nothing can be carried" >&2; exit 1; }

          : > /tmp/plan.tsv
          fresh=""
          carried=""
          absent=""
          for arch in amd64 arm64 armv7 loong64 riscv64 ppc ppc64 ppc64le; do
            if [ -s "/tmp/digests/$arch" ]; then
              printf '%s\t%s\tfresh\n' "$arch" "$TARGET_IMAGE@$(cat "/tmp/digests/$arch")" >> /tmp/plan.tsv
              fresh="$fresh $arch"
              continue
            fi
            # The rolling single architecture tag is the docker architecture
            # name itself, and scripts/tag-names always emits it.
            digest="$(curl -sSI --connect-timeout 15 --max-time 60 --retry 2 --retry-delay 5 \
              -H "Authorization: Bearer $token" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${repo}/manifests/${arch}" \
              | awk 'tolower($1) == "docker-content-digest:" { print $2 }' | tr -d '\r')"
            if [ -n "$digest" ]; then
              printf '%s\t%s\tcarried\n' "$arch" "$CARRY_IMAGE@$digest" >> /tmp/plan.tsv
              carried="$carried $arch"
              echo "::warning::$arch did not build in this run, so the index carries its last published image, $digest"
            else
              absent="$absent $arch"
              echo "::error::$arch did not build and was never published, so the index goes out without it"
            fi
          done
          cat /tmp/plan.tsv
          {
            echo "fresh=${fresh# }"
            echo "carried=${carried# }"
            echo "absent=${absent# }"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$fresh" ]; then
            echo "no architecture built in this run, so no tag moves" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: needs.resolve.outputs.publish_hub == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ⛔ A pinned tag is created once and never pointed anywhere else:
      # v<date>, <alias>-v<date> and <alias>-<anchor>. The two steps below pass
      # this list to scripts/tag-names, which leaves out each pinned tag already
      # on it. So a second build on one day, or with one pacman version, moves
      # latest and <alias> only. GHCR is read because every digest is staged
      # there and both registries get their tags from one command. A list that
      # cannot be read stops the job, because read as empty it would move every
      # pinned tag. HISTORY/pinned-tags.md.
      - name: Read the tags the repository already carries
        env:
          TARGET_IMAGE: ${{ needs.resolve.outputs.target_image }}
        run: |
          set -euo pipefail
          scripts/registry-tags ghcr.io "${TARGET_IMAGE#ghcr.io/}" > /tmp/existing-tags.txt

      # Only for what built in this run. A carried architecture's tags already
      # point at the image it carries, so they are left exactly where they are.
      - name: Create the per architecture tags
        env:
          TARGET_IMAGE: ${{ needs.resolve.outputs.target_image }}
          HUB_TARGET: ${{ needs.resolve.outputs.hub_image }}
          PUBLISH_HUB: ${{ needs.resolve.outputs.publish_hub }}
          VERSION: ${{ needs.resolve.outputs.version }}
          ANCHORS: ${{ needs.resolve.outputs.cleared }}
        run: |
          set -euo pipefail
          images=("$TARGET_IMAGE")
          if [ "$PUBLISH_HUB" = "true" ]; then
            images+=("$HUB_TARGET")
          fi
          for arch in amd64 arm64 armv7 loong64 riscv64 ppc ppc64 ppc64le; do
            source="$(awk -F'\t' -v a="$arch" '$1 == a && $3 == "fresh" { print $2 }' /tmp/plan.tsv)"
            if [ -z "$source" ]; then
              echo "==> $arch was not built in this run, its tags stay where they are"
              continue
            fi
            anchor="$(jq -er --arg a "$arch" '.[$a]' <<< "$ANCHORS")"
            mapfile -t tags < <(scripts/tag-names --existing /tmp/existing-tags.txt arch "$arch" "$VERSION" "$anchor" "${images[@]}")
            # mapfile does not see the exit status of tag-names. The rolling
            # tags are always printed, so an empty list means it failed.
            if [ "${#tags[@]}" -eq 0 ]; then
              echo "scripts/tag-names printed no tag for $arch, and its reason is above" >&2
              exit 1
            fi
            args=()
            for t in "${tags[@]}"; do
              args+=(-t "$t")
            done
            echo "==> $arch $source"
            printf '    %s\n' "${tags[@]}"
            docker buildx imagetools create "${args[@]}" "$source"
          done

      - name: Create the index tags
        env:
          TARGET_IMAGE: ${{ needs.resolve.outputs.target_image }}
          HUB_TARGET: ${{ needs.resolve.outputs.hub_image }}
          PUBLISH_HUB: ${{ needs.resolve.outputs.publish_hub }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          images=("$TARGET_IMAGE")
          if [ "$PUBLISH_HUB" = "true" ]; then
            images+=("$HUB_TARGET")
          fi
          mapfile -t sources < <(awk -F'\t' 'NF >= 2 { print $2 }' /tmp/plan.tsv)
          if [ "${#sources[@]}" -eq 0 ]; then
            echo "the plan names no image, so there is no index to create" >&2
            exit 1
          fi
          mapfile -t tags < <(scripts/tag-names --existing /tmp/existing-tags.txt index "$VERSION" "${images[@]}")
          if [ "${#tags[@]}" -eq 0 ]; then
            echo "scripts/tag-names printed no index tag, and its reason is above" >&2
            exit 1
          fi
          args=()
          for t in "${tags[@]}"; do
            args+=(-t "$t")
          done
          printf '    %s\n' "${tags[@]}"
          printf '    from %s\n' "${sources[@]}"
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Verify what was published
        env:
          TARGET_IMAGE: ${{ needs.resolve.outputs.target_image }}
          HUB_TARGET: ${{ needs.resolve.outputs.hub_image }}
          PUBLISH_HUB: ${{ needs.resolve.outputs.publish_hub }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail

          # ⛔ Both registries are verified, not just the one the digests were
          # staged on. Copying across registries is a separate operation that can
          # fail on its own, and until this step covered it a Docker Hub tag that
          # never arrived, or arrived without every platform, ended a green run.
          verify_index() {
            local image="$1" latest dated got expect arch
            # scripts/tag-names is the authority on the spelling, so it is
            # asked rather than reconstructed: inspecting a tag the publish job
            # never created would fail every run.
            latest="$(scripts/tag-names index "$VERSION" "$image" | grep ':latest$')"
            dated="$(scripts/tag-names index "$VERSION" "$image" | grep -v ':latest$')"

            # ⛔ latest is the index this run wrote. The dated index is pinned:
            # the first build of the day creates it and a later one leaves it,
            # so its platforms are that build's. It has to exist, whichever
            # run created it.
            if ! docker buildx imagetools inspect "$dated" > /dev/null; then
              echo "$dated does not exist after the publish" >&2
              exit 1
            fi
            echo "verifying $latest"

            # The index must carry every platform the plan put in it, built or
            # carried. An index with a hole in it is the failure this whole
            # topology exists to prevent.
            got="$(docker buildx imagetools inspect "$latest" --raw \
              | jq -r '[ .manifests[].platform
                         | select(.os != "unknown")
                         | .architecture + (if .variant then "/" + .variant else "" end) ]
                       | sort | join(" ")')"
            echo "index platforms: $got"

            # armv7 renders as arm/v7. A bare match on arm would also match
            # arm64, so the assertion would pass with armv7 missing and mean
            # nothing. An architecture the plan left out is skipped, and the
            # plan step has already named it as an error.
            for expect in amd64 arm64 loong64 riscv64 ppc ppc64 ppc64le arm/v7; do
              arch="${expect/arm\/v7/armv7}"
              if ! awk -F'\t' -v a="$arch" '$1 == a { found = 1 } END { exit found ? 0 : 1 }' /tmp/plan.tsv; then
                continue
              fi
              if ! grep -qw -- "$expect" <<< "$got"; then
                echo "the index for $latest is missing $expect" >&2
                echo "it carries: $got" >&2
                echo "the digests were staged on ${TARGET_IMAGE}. If that index is" >&2
                echo "complete and this one is not, the cross-registry copy is what failed." >&2
                exit 1
              fi
            done
            echo "::notice::published $latest with platforms $got, and $dated exists"
          }

          verify_index "$TARGET_IMAGE"
          if [ "$PUBLISH_HUB" = "true" ]; then
            verify_index "$HUB_TARGET"
          else
            echo "::notice::publish_hub is false, so no Docker Hub tag was created or verified"
          fi

  #----------------------------------------------------------------------------------#
  # ⛔ The loud half of carrying an architecture forward. One issue per
  # architecture that did not publish fresh, opened the first day, kept current
  # while it lasts, and closed by the first run that publishes it again. A port
  # that is down for a month is one notification, not thirty red runs that teach
  # everyone to stop reading them.
  #
  # ⛔ needs: everything, and if: always(), so it reports on a run that broke
  # anywhere. Nothing needs it. A dry run reports nothing.
  #----------------------------------------------------------------------------------#
  report:
    name: Track what did not publish
    needs: [resolve, build, publish]
    if: ${{ always() && inputs.dry_run != true && needs.resolve.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open, update or close one issue per architecture
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVE: ${{ needs.resolve.result }}
          PUBLISH: ${{ needs.publish.result }}
          UNREACHABLE: ${{ needs.resolve.outputs.unreachable }}
          REFUSED: ${{ needs.resolve.outputs.refused }}
          FRESH: ${{ needs.publish.outputs.fresh }}
          CARRIED: ${{ needs.publish.outputs.carried }}
          ABSENT: ${{ needs.publish.outputs.absent }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          today="$(date -u +%Y-%m-%d)"

          # The run as a whole. Nothing per architecture can be said when the
          # inputs never resolved or the tags never moved.
          if [ "$RESOLVE" != "success" ] || [ "$PUBLISH" != "success" ]; then
            # The printf formats are markdown. Backticks inside them are
            # literal text for the issue body, not shell expansions.
            # shellcheck disable=SC2016
            {
              printf 'The scheduled build did not publish on %s.\n\n' "$today"
              printf '| job | result |\n| --- | --- |\n'
              printf '| Resolve inputs | `%s` |\n| Create tags | `%s` |\n\n' "$RESOLVE" "$PUBLISH"
              printf 'Run: %s\n\n' "$RUN_URL"
              printf 'Every architecture keeps the image its tags already point at. This\n'
              printf 'issue closes itself on the first run that publishes again.\n'
            } > /tmp/run.md
            scripts/track-issue raise build-run "build: the daily publish did not run to the end" /tmp/run.md
          else
            scripts/track-issue clear build-run "Published again in $RUN_URL."
          fi

          member() {
            tr ' ' '\n' <<< "$2" | awk -v a="$1" '$0 == a { found = 1 } END { exit found ? 0 : 1 }'
          }

          for arch in amd64 arm64 armv7 loong64 riscv64 ppc ppc64 ppc64le; do
            if member "$arch" "$FRESH"; then
              scripts/track-issue clear "build-$arch" "$arch published again in $RUN_URL."
              continue
            fi
            if [ "$RESOLVE" != "success" ] || [ "$PUBLISH" != "success" ]; then
              # Already reported as a whole above.
              continue
            fi
            if member "$arch" "$UNREACHABLE"; then
              why="no mirror in \`rootfs/$arch/etc/pacman.d/mirrorlist\` served its database to a GitHub runner. The port is not built until one does, and nothing here needs to change for it to come back."
            elif member "$arch" "$REFUSED"; then
              why="its anchor went backwards against what is already published, so the rollback guard refused it. If upstream really reverted, dispatch the build with \`allow_anchor_downgrade\`. HISTORY/arm-rollback.md."
            else
              why="its build job failed. The job log in the run below names the step and the reason."
            fi
            if member "$arch" "$CARRIED"; then
              state="The multi architecture index keeps carrying the last image published for it, so \`latest\` still serves $arch."
            elif member "$arch" "$ABSENT"; then
              state="⛔ It has never been published, so the index goes out without it."
            else
              state="-"
            fi
            # shellcheck disable=SC2016
            {
              printf '`%s` did not publish on %s: %s\n\n' "$arch" "$today" "$why"
              printf '%s\n\n' "$state"
              printf 'Last checked: %s\n\n' "$RUN_URL"
              printf 'This issue closes itself on the first run that publishes `%s` again.\n' "$arch"
            } > "/tmp/$arch.md"
            scripts/track-issue raise "build-$arch" "build: $arch is not publishing" "/tmp/$arch.md"
          done

  #----------------------------------------------------------------------------------#
  # The other half of the publish watchdog.
  #
  # ⛔ freshness-publish.yml watches whether this workflow's schedule is still
  # firing. Nothing would watch whether that one's is, so this runs the same
  # check and the two become each other's witness. A schedule that stops
  # produces no run, so the only place its silence can be seen is a run of
  # something else.
  #
  # ⛔ needs: nothing, and nothing needs it. A broken watchdog must not be able
  # to stop a publish: the run goes red while every tag is still created. That
  # is the correct shape for an alarm that is not a gate.
  #
  # ⚠ What this cannot see is itself. If the schedule on this workflow stops,
  # this job stops with it, which is exactly why the check also lives in a
  # workflow on a different schedule.
  #----------------------------------------------------------------------------------#
  watchdog:
    name: Check the schedules are still firing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every schedule in the repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rc=0
          scripts/check-schedules-fired || rc=$?
          case "$rc" in
            0) echo "::notice::every schedule has fired within its own tolerance" ;;
            3)
              echo "::error::at least one schedule has stopped firing"
              echo "⛔ The publish itself is unaffected: this job gates nothing." >&2
              exit 1
              ;;
            *) echo "the schedule check could not run" >&2; exit 1 ;;
          esac

  #----------------------------------------------------------------------------------#
  # ⛔ GitHub disables every scheduled workflow in a repository with 60 days of
  # no activity, and a disabled schedule produces no run that could notice. This
  # turns every workflow in the repository back on, every day, so a quiet
  # stretch never reaches the cut off. freshness-publish.yml does the same, so
  # either one firing keeps both alive.
  #
  # ⛔ It depends on no job and no job depends on it, like the watchdog.
  #----------------------------------------------------------------------------------#
  keepalive:
    name: Keep every schedule enabled
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable every workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/keep-schedules-enabled
