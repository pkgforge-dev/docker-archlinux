name: Freshness, port keyring pins

# Three ports sign with keys archlinux-keyring does not carry, and each has a pin
# in bootstrap/keyrings/ with the pinned package carried beside it. A port that
# re-signs publishes a new keyring package and deletes the old one from its
# mirror. The build no longer breaks on that: it reads the package from the
# tree and follows the port forward through the pinned keys. This job moves the
# pin itself, so the tree does not drift further behind each time.
#
# ⭐ What it does with each result:
#
#   0  current           nothing
#   3  behind            apply, test, propose. The pinned package is still served
#   4  gone              apply, test, propose. The tree's copy keeps builds working
#   5  bytes changed     an issue. The same name now carries different bytes
#   6  unreachable       a warning. No mirror answered this runner
#   7  unsigned move     an issue. No key the pin trusts signed the new package
#
# ⛔ One job per pin. Two trust roots moving in one pull request would hide which
# one moved, and the two are tested by building different architectures.
on:
  workflow_dispatch:
  schedule:
    - cron: "15 04 * * 1"  # Mondays, 04:15 UTC

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: freshness-keyring
  cancel-in-progress: false

jobs:
  check:
    name: Check the ${{ matrix.keyring }} pin
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
      issues: write
    strategy:
      # One run reports every stale pin. Neither blocks the other.
      fail-fast: false
      matrix:
        include:
          # docker_arch is the architecture built to test a bump. Both ARM ports
          # share the ARM keyring, so one of the two exercises it.
          - keyring: archlinuxarm
            pin: bootstrap/keyrings/archlinuxarm.pin
            docker_arch: arm64
            platform: linux/arm64
          - keyring: archlinux-lcpu
            pin: bootstrap/keyrings/archlinux-lcpu.pin
            docker_arch: loong64
            platform: linux/loong64
          # All three PowerPC ports share one trust root, so one of the three
          # exercises it. ppc64le is the one chosen because it is the only
          # PowerPC target the standard QEMU setup already covers, so this job
          # needs no emulator registration of its own.
          - keyring: archpower
            pin: bootstrap/keyrings/archpower.pin
            docker_arch: ppc64le
            platform: linux/ppc64le
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ⛔ The status is captured, never read after the fact. Actions runs a
      # bash step with -e, so a check that exits 3 kills the step on the spot
      # and a later rc=$? never runs. That is how this job went red every
      # Monday from 2026-09-07 and never opened the pull request it exists for.
      - name: Compare the pin against the mirror
        id: check
        env:
          PIN: ${{ matrix.pin }}
        run: |
          set -euo pipefail
          rc=0
          scripts/check-keyring-pin "$PIN" > /tmp/check.txt || rc=$?
          cat /tmp/check.txt
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0) echo "::notice::${PIN} is current" ;;
            3) echo "::warning::a newer keyring is published for ${PIN}, preparing a pull request" ;;
            4) echo "::warning::the package ${PIN} pins is gone from the mirror. The tree carries it, so builds go on, and the pin is behind" ;;
            5) echo "::error::the package ${PIN} pins still answers and its bytes changed" ;;
            6) echo "::warning::no mirror ${PIN} names answered this runner, so nothing was compared" ;;
            7) echo "::error::a newer keyring is published for ${PIN} and no key the pin trusts signed it" ;;
            *) echo "the freshness check could not run" >&2; exit 1 ;;
          esac

      # ⛔ Reported on every run, including a green one. A trusted key past its
      # expiry signs nothing pacman will take, so the count of usable keys falls
      # with no upstream change at all and nothing else would say so.
      - name: Report the expiry horizon
        env:
          EXPIRED: ${{ steps.check.outputs.expired_now }}
          SOON: ${{ steps.check.outputs.expiring_soon }}
          COUNT: ${{ steps.check.outputs.trusted_count }}
          KEYRING: ${{ matrix.keyring }}
        run: |
          set -euo pipefail
          echo "${KEYRING}: ${COUNT} trusted fingerprint(s) pinned"
          echo "  expired today : ${EXPIRED:-none}"
          echo "  expiring < 1y : ${SOON:-none}"
          if [ -n "${SOON:-}" ] && [ "${SOON:-none}" != "none" ]; then
            echo "::warning::${KEYRING} has trusted keys expiring within a year: ${SOON}"
          fi

      # ⭐ The two results that need a person get an issue, opened once and kept
      # current. Every other result closes it.
      - name: Raise or clear the issue for this pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC: ${{ steps.check.outputs.rc }}
          PIN: ${{ matrix.pin }}
          KEYRING: ${{ matrix.keyring }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          case "$RC" in
            5 | 7)
              # The printf formats are markdown. Backticks inside them are
              # literal text for the issue body, not shell expansions.
              # shellcheck disable=SC2016
              {
                printf 'The `%s` pin needs a person: `scripts/check-keyring-pin %s` exited %s.\n\n' "$KEYRING" "$PIN" "$RC"
                printf '```\n'
                cat /tmp/check.txt
                printf '```\n\n'
                printf 'Nothing is applied automatically for this result. The build keeps using the\n'
                printf 'package carried in the tree. Run: %s\n' "$RUN_URL"
              } > /tmp/issue.md
              scripts/track-issue raise "keyring-$KEYRING" "keyring: the $KEYRING pin needs a person" /tmp/issue.md
              ;;
            6) echo "unreachable, the issue is left as it is" ;;
            *) scripts/track-issue clear "keyring-$KEYRING" "Resolved: check-keyring-pin exited $RC in $RUN_URL." ;;
          esac

      # ⭐ A current pin needs no pull request. One left open from an earlier run
      # is closed, so every open freshness pull request is one worth merging.
      - name: Withdraw a proposal the pin no longer needs
        if: steps.check.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYRING: ${{ matrix.keyring }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          scripts/propose-change --withdraw "freshness/keyring-${KEYRING}" \
            "Withdrawn: the pin on main is current, $RUN_URL."

      - name: Apply the bump on a branch
        if: steps.check.outputs.rc == '3' || steps.check.outputs.rc == '4'
        id: apply
        env:
          PIN: ${{ matrix.pin }}
        run: |
          set -euo pipefail
          rc=0
          scripts/check-keyring-pin --apply "$PIN" > /tmp/apply.txt || rc=$?
          cat /tmp/apply.txt
          case "$rc" in
            3 | 4) ;;
            *)
              echo "applying the bump reported $rc rather than a bump, refusing to propose it" >&2
              exit 1
              ;;
          esac
          # check-keyring-pin writes the measured values straight to
          # GITHUB_OUTPUT when it runs under Actions, so nothing is re-parsed
          # out of its human readable output here.
          git status --short

      - name: Set up QEMU
        if: steps.check.outputs.rc == '3' || steps.check.outputs.rc == '4'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Test the bump with the tests that guard a normal build
        if: steps.check.outputs.rc == '3' || steps.check.outputs.rc == '4'
        id: test
        env:
          DOCKER_ARCH: ${{ matrix.docker_arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          echo "::group::static suite"
          tests/run.sh static
          echo "::endgroup::"

          # One architecture is built and inspected, because a keyring that
          # installs but does not verify produces an empty root rather than a
          # build error.
          ver="$(date -u +%Y.%m.%d)"
          docker build --platform "$PLATFORM" \
            --build-arg "IMAGE_VERSION=$ver" \
            --build-arg "SOURCE_COMMIT=${{ github.sha }}" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "freshness-check:$DOCKER_ARCH" .

          # The databases the build resolved against, so the evidence is not
          # joined against a set that moved. HISTORY/evidence-race.md.
          docker build --platform "$PLATFORM" --target dbsnapshot \
            --build-arg "IMAGE_VERSION=$ver" \
            --output "type=local,dest=/tmp/dbsnapshot" .

          echo "::group::image suite"
          # ⛔ CONTAINER_RUNTIME is not optional. The runner image carries both
          # docker and podman, and gen-evidence prefers podman when it finds
          # one. The image was built with docker and lives in docker's store, so
          # podman tries to pull it from Docker Hub and quay.io and fails.
          SOURCE_COMMIT="${{ github.sha }}" BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            DB_SNAPSHOT=/tmp/dbsnapshot CONTAINER_RUNTIME=docker \
            scripts/gen-evidence "$DOCKER_ARCH" "freshness-check:$DOCKER_ARCH" "$PLATFORM" \
              "/tmp/evidence-$DOCKER_ARCH.json"
          IMAGE="freshness-check:$DOCKER_ARCH" PLATFORM="$PLATFORM" CONTAINER_RUNTIME=docker \
            EVIDENCE="/tmp/evidence-$DOCKER_ARCH.json" tests/run.sh image
          echo "::endgroup::"

          pkgs="$(jq -r '.package_count' "/tmp/evidence-$DOCKER_ARCH.json")"
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"

      - name: Propose the bump, carrying the measurement
        if: steps.check.outputs.rc == '3' || steps.check.outputs.rc == '4'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIN: ${{ matrix.pin }}
          KEYRING: ${{ matrix.keyring }}
          DOCKER_ARCH: ${{ matrix.docker_arch }}
          OLD_PACKAGE: ${{ steps.apply.outputs.old_package }}
          OLD_SHA: ${{ steps.apply.outputs.old_sha256 }}
          NEW_PACKAGE: ${{ steps.apply.outputs.new_package }}
          NEW_SHA: ${{ steps.apply.outputs.new_sha256 }}
          NEW_SIZE: ${{ steps.apply.outputs.new_size }}
          TRUSTED_COUNT: ${{ steps.apply.outputs.trusted_count }}
          TRUSTED_ADDED: ${{ steps.apply.outputs.trusted_added }}
          TRUSTED_REMOVED: ${{ steps.apply.outputs.trusted_removed }}
          EXPIRED: ${{ steps.apply.outputs.expired_now }}
          SOON: ${{ steps.apply.outputs.expiring_soon }}
          PINNED_HTTP: ${{ steps.apply.outputs.pinned_http }}
          PACKAGES: ${{ steps.test.outputs.packages }}
          RC: ${{ steps.check.outputs.rc }}
        run: |
          set -euo pipefail
          urgency="a newer keyring is published and the pinned one still answers"
          if [ "$RC" = "4" ]; then
            urgency="the pinned keyring is gone from the mirror. Builds read the copy in the tree, so nothing is broken, and the pin is behind"
          fi

          # The printf formats are markdown. Backticks inside them are literal
          # text for the pull request body, not shell expansions.
          # shellcheck disable=SC2016
          {
            printf '## What moved\n\n'
            printf 'The `%s` trust root changed: %s.\n\n' "$KEYRING" "$urgency"
            printf '| | pinned before | pinned now |\n'
            printf '| --- | --- | --- |\n'
            printf '| package | `%s` | `%s` |\n' "$OLD_PACKAGE" "$NEW_PACKAGE"
            printf '| sha256 | `%s` | `%s` |\n\n' "$OLD_SHA" "$NEW_SHA"
            printf 'The old package answered HTTP `%s` at check time. The new package is\n' "$PINNED_HTTP"
            printf '`%s` bytes, trusts `%s` fingerprint(s), and is carried in the tree\n' "$NEW_SIZE" "$TRUSTED_COUNT"
            printf 'beside the pin in place of the old one.\n\n'
            printf '| trusted keys | fingerprints |\n'
            printf '| --- | --- |\n'
            printf '| added | `%s` |\n' "$TRUSTED_ADDED"
            printf '| removed | `%s` |\n' "$TRUSTED_REMOVED"
            printf '| expired as of today | `%s` |\n' "$EXPIRED"
            printf '| expiring within a year | `%s` |\n\n' "$SOON"
            printf 'Every value above was re-derived from the package itself by\n'
            printf '`scripts/check-keyring-pin`, which also checked that the new package is\n'
            printf 'signed by a key the old pin trusts. None was copied from a report.\n\n'
            printf '## What the tests did\n\n'
            printf -- '- `tests/run.sh static`, the same suite the build job runs first.\n'
            printf -- '- A full `%s` build from this branch.\n' "$DOCKER_ARCH"
            printf -- '- `scripts/gen-evidence` then `tests/run.sh image` against that build,\n'
            printf '  which installed `%s` packages.\n' "$PACKAGES"
            printf -- '- CI is dispatched on this branch, so the required check reports here.\n\n'
            printf 'Signature verification stayed at `SigLevel = Required` throughout.\n\n'
            printf '## ⚠ What this job did NOT verify\n\n'
            printf -- '- **Only `%s` was built.** The other architectures were not.\n' "$DOCKER_ARCH"
            printf -- '- **The new fingerprints were not checked against any source other than\n'
            printf '  the package that carries them and the signature on it.** That is the\n'
            printf '  trust model these pins use.\n'
            printf -- '- **No image was published.** The build stayed on the runner.\n'
            printf -- '- **The mirror was read once.** A mirror mid sync can serve an older\n'
            printf '  listing than another mirror.\n'
          } > /tmp/body.md

          scripts/propose-change "freshness/keyring-${KEYRING}" "keyring: pin ${NEW_PACKAGE}" \
            /tmp/body.md bootstrap/keyrings
