# Fixture: a copy of ports/amd64.conf for the status tests.
arch = amd64
platform = linux/amd64
pacman_arch = x86_64
aliases = x86_64 amd64
distribution = Arch Linux
homepage = https://archlinux.org
repos = core extra
keyring = none
binfmt = native
qemu = qemu-x86_64
